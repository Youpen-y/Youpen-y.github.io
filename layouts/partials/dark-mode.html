<script>
    const htmlEl = document.documentElement;

    // get local saved theme
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;

    // init theme
    const currentTheme = savedTheme || (systemPrefersLight ? 'light' : 'dark');
    htmlEl.dataset.theme = currentTheme;

    // sync giscus theme on load
    function syncGiscusTheme() {
        const giscusFrame = document.querySelector('iframe.giscus-frame');
        if (giscusFrame) {
            giscusFrame.contentWindow.postMessage(
                { giscus: { setConfig: { theme: currentTheme } } },
                'https://giscus.app'
            );
        } else {
            setTimeout(syncGiscusTheme, 500);
        }
    }
    window.addEventListener('load', syncGiscusTheme);

    // toggle theme
    function toggleTheme(theme) {
        htmlEl.dataset.theme = theme;
        localStorage.setItem('theme', theme);

        // sync giscus theme
        const giscusFrame = document.querySelector('iframe.giscus-frame');
        if (giscusFrame) {
            giscusFrame.contentWindow.postMessage(
                { giscus: { setConfig: { theme: theme } } },
                'https://giscus.app'
            );
        }
    }

    window.addEventListener('message', (event) => {
        if (event.origin !== 'https://giscus.app') return;
        if (event.data?.giscus?.discussion) {
            const giscusFrame = document.querySelector('iframe.giscus-frame');
            if (giscusFrame) {
                giscusFrame.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: htmlEl.dataset.theme } } },
                    'https://giscus.app'
                );
            }
        }
    });

    // auto-change theme
    if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            const systemTheme = e.matches ? 'dark' : 'light';
            toggleTheme(systemTheme);
        });
    }
</script>
<button
    class="data-theme-btn dark-hidden"
    onclick="toggleTheme('dark');"
    aria-label="Enable dark theme"
>
    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#3f4b67"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
</button>
<button
    class="data-theme-btn light-hidden"
    onclick="toggleTheme('light');"
    aria-label="Enable light theme"
>
    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#e9e9e9"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <circle cx="12" cy="12" r="5" />
        <path
            d="M12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8l1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
        />
    </svg>
</button>
