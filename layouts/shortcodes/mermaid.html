{{- if not ($.Page.Scratch.Get "mermaidLoaded") -}}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
function getMermaidConfig() {
  var isDark = document.documentElement.dataset.theme === 'dark';
  return {
    startOnLoad: true,
    theme: isDark ? 'dark' : 'default',
    themeVariables: isDark ? {
      primaryTextColor: '#e9e9e9',
      secondaryTextColor: '#ccc',
      tertiaryTextColor: '#aaa',
      lineColor: '#888',
      noteBkgColor: '#2a2a2a',
      noteTextColor: '#e9e9e9',
      actorTextColor: '#e9e9e9',
      actorBorder: '#555',
      actorBkg: '#333',
      signalColor: '#ccc',
      signalTextColor: '#e9e9e9',
      labelTextColor: '#e9e9e9',
      loopTextColor: '#e9e9e9',
      activationBorderColor: '#555',
      activationBkgColor: '#444'
    } : {}
  };
}

document.addEventListener('DOMContentLoaded', function() {
  // Save original source before mermaid processes it
  document.querySelectorAll('.mermaid-source').forEach(function(el) {
    var target = el.nextElementSibling;
    if (target && target.classList.contains('mermaid')) {
      target.setAttribute('data-source', el.textContent);
    }
  });

  mermaid.initialize(getMermaidConfig());

  // Re-render on theme toggle
  var observer = new MutationObserver(function() {
    document.querySelectorAll('.mermaid').forEach(function(el) {
      var source = el.getAttribute('data-source');
      if (source) {
        el.removeAttribute('data-processed');
        el.innerHTML = source;
      }
    });
    mermaid.initialize(getMermaidConfig());
    mermaid.run();
  });
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme']
  });
});
</script>
{{- $.Page.Scratch.Set "mermaidLoaded" true -}}
{{- end -}}

<div class="mermaid-source" hidden>{{ .Inner }}</div>
<div class="mermaid">
{{ .Inner }}
</div>
